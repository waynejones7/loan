<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>银行准入速查</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #eef5ff;
      --panel: #fbfdff;
      --ink: #102033;
      --muted: #64748b;
      --line: #d8e4f4;
      --brand: #1d4ed8;
      --brand-deep: #0f2f68;
      --brand-soft: #e8f1ff;
      --accent: #0891b2;
      --warn: #b7791f;
      --shadow: 0 16px 38px rgba(15, 47, 104, 0.14);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 34%),
        radial-gradient(circle at 85% 12%, rgba(8, 145, 178, 0.12), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 50%, #e6effb 100%);
      color: var(--ink);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(251, 253, 255, 0.9);
      border-left: 1px solid rgba(216, 228, 244, 0.9);
      border-right: 1px solid rgba(216, 228, 244, 0.9);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px 14px 12px;
      background: rgba(251, 253, 255, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .count-pill {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #c7d7f1;
      border-radius: 8px;
      color: var(--brand-deep);
      background: var(--brand-soft);
      font-size: 12px;
      font-weight: 700;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid #b7c9e8;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(15, 47, 104, 0.08);
    }
    .search-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--brand);
      font-size: 17px;
    }
    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
    }
    .search input::placeholder { color: #94a3b8; }
    .clear-btn {
      display: none;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      color: #475569;
      background: #edf4ff;
      font-size: 18px;
      line-height: 1;
    }
    .filter-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 46px;
      overflow: hidden;
      padding: 12px 14px 8px;
      transition: max-height 180ms ease;
    }
    .filter-strip.expanded {
      max-height: 240px;
    }
    .chip {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #c9d7ee;
      border-radius: 8px;
      color: #1e3a5f;
      background: #fff;
      font-size: 13px;
      font-weight: 650;
    }
    .chip.active {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.24);
    }
    .chip.more-chip {
      color: var(--brand);
      background: #f8fbff;
      border-style: dashed;
    }
    .filter-strip.expanded .chip.more-chip {
      width: auto;
    }
    #toggleFilters {
      min-height: 30px;
      padding: 0 10px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 2px 14px 12px;
    }
    .summary-item {
      min-height: 58px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }
    .summary-item strong {
      display: block;
      font-size: 18px;
      color: var(--brand-deep);
      line-height: 1.1;
    }
    .summary-item span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 14px 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select {
      height: 32px;
      border: 1px solid #c9d7ee;
      border-radius: 8px;
      color: #17345f;
      background: #fff;
      padding: 0 8px;
      outline: 0;
    }
    .list {
      display: grid;
      gap: 10px;
      padding: 0 14px 96px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(15, 47, 104, 0.08);
      overflow: hidden;
    }
    .card button {
      width: 100%;
      border: 0;
      padding: 13px 13px 12px;
      text-align: left;
      background: transparent;
      color: inherit;
    }
    .card-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .bank {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .product {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .type {
      padding: 5px 8px;
      border-radius: 7px;
      color: var(--brand-deep);
      background: var(--brand-soft);
      font-size: 12px;
      white-space: nowrap;
      font-weight: 700;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 12px;
    }
    .metric {
      min-width: 0;
      padding: 8px 7px;
      border: 1px solid #edf4ff;
      border-radius: 7px;
      background: #f8fbff;
    }
    .metric span {
      display: block;
      color: #7b8da8;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .metric strong {
      display: block;
      color: #12243d;
      font-size: 13px;
      line-height: 1.25;
      word-break: break-word;
    }
    .match-line {
      margin-top: 10px;
      color: #52657f;
      font-size: 12px;
      line-height: 1.5;
    }
    mark {
      padding: 0 2px;
      border-radius: 3px;
      color: #7a3d00;
      background: #fdecc8;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tag {
      max-width: 100%;
      padding: 4px 7px;
      border-radius: 6px;
      color: #425674;
      background: #edf4ff;
      font-size: 11px;
      line-height: 1.2;
    }
    .empty {
      display: none;
      margin: 16px 14px 0;
      padding: 26px 18px;
      border: 1px dashed #b8cbe8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
      text-align: center;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 16px;
    }
    .drawer-mask {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(9, 25, 55, 0.48);
    }
    .drawer {
      width: min(100%, 760px);
      max-height: 88vh;
      overflow: auto;
      border-radius: 14px 14px 0 0;
      background: var(--panel);
      box-shadow: var(--shadow);
      animation: rise 180ms ease-out;
    }
    @keyframes rise {
      from { transform: translateY(22px); opacity: 0.75; }
      to { transform: translateY(0); opacity: 1; }
    }
    .drawer-top {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 253, 255, 0.96);
      backdrop-filter: blur(12px);
    }
    .handle {
      width: 42px;
      height: 4px;
      margin: 0 auto 12px;
      border-radius: 999px;
      background: #c7d6eb;
    }
    .drawer-title {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .drawer-title h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
    }
    .drawer-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .close {
      width: 34px;
      height: 34px;
      border: 1px solid #d7e3f3;
      border-radius: 8px;
      background: #fff;
      color: #425674;
      font-size: 20px;
      line-height: 1;
    }
    .drawer-body {
      padding: 12px 14px 24px;
    }
    .detail-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .flag-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 10px 0 12px;
    }
    .flag {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #253b5a;
      font-size: 12px;
    }
    .flag b {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .block {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .block h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #12243d;
    }
    .block p, .block li {
      color: #425674;
      font-size: 13px;
      line-height: 1.65;
    }
    .block ul {
      margin: 0;
      padding-left: 18px;
    }
    .source {
      margin: 14px 2px 0;
      color: #8090a6;
      font-size: 11px;
      line-height: 1.5;
    }
    .fab {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(calc(100% - 28px), 732px);
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(199, 215, 238, 0.95);
      border-radius: 10px;
      background: rgba(251, 253, 255, 0.95);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .fab button {
      flex: 1;
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--brand);
      font-weight: 750;
      font-size: 13px;
    }
    .fab button.secondary {
      color: var(--brand-deep);
      background: var(--brand-soft);
    }
    @media (min-width: 760px) {
      .app { margin: 20px auto; min-height: calc(100vh - 40px); border-radius: 14px; overflow: hidden; }
      .topbar { border-radius: 14px 14px 0 0; }
      .drawer { border-radius: 14px; margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <h1>银行准入速查</h1>
          <p>输入客户资质，快速定位可进件产品</p>
        </div>
        <div class="count-pill" id="dataCount">0 条产品</div>
      </div>
      <label class="search" for="searchInput">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="搜：公积金 上海房 法人 查询少 50万" />
        <button class="clear-btn" id="clearBtn" type="button" aria-label="清空">×</button>
      </label>
    </header>

    <nav class="filter-strip" id="filters" aria-label="快捷筛选"></nav>

    <section class="summary">
      <div class="summary-item"><strong id="resultTotal">0</strong><span>匹配产品</span></div>
      <div class="summary-item"><strong id="bankTotal">0</strong><span>涉及银行</span></div>
      <div class="summary-item"><strong id="topType">-</strong><span>主要类型</span></div>
    </section>

    <section class="tools">
      <span id="hintText">可输入多个关键词，空格分隔</span>
      <label class="select-wrap">排序
        <select id="sortSelect">
          <option value="match">匹配优先</option>
          <option value="amount">额度优先</option>
          <option value="rate">低利率优先</option>
          <option value="bank">银行名称</option>
        </select>
      </label>
    </section>

    <section class="list" id="list"></section>
    <section class="empty" id="empty">
      <strong>暂时没有匹配结果</strong>
      试试换成“社保”“房贷”“经营贷”“白名单”“线下面签”等关键词。
    </section>
  </main>

  <div class="drawer-mask" id="drawerMask">
    <article class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-top">
        <div class="handle"></div>
        <div class="drawer-title">
          <div>
            <h2 id="drawerTitle"></h2>
            <p id="drawerSub"></p>
          </div>
          <button class="close" id="closeDrawer" type="button" aria-label="关闭">×</button>
        </div>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </article>
  </div>

  <div class="fab">
    <button class="secondary" id="resetBtn" type="button">重置筛选</button>
    <button id="focusBtn" type="button">继续搜索</button>
  </div>

  <script src="./products.js"></script>
  <script>
    const products = Array.isArray(window.BANK_PRODUCTS) ? window.BANK_PRODUCTS : [];
    const filters = ["全部", "公积金", "社保", "个税", "房产", "经营贷", "消费分期", "法人", "低利率", "高额度", "线上", "面签", "白名单"];
    let activeFilter = "全部";
    let query = "";
    let filtersExpanded = false;

    const $ = (id) => document.getElementById(id);
    const searchInput = $("searchInput");
    const clearBtn = $("clearBtn");
    const list = $("list");
    const empty = $("empty");
    const filtersNode = $("filters");
    const resultTotal = $("resultTotal");
    const bankTotal = $("bankTotal");
    const topType = $("topType");
    const hintText = $("hintText");
    const sortSelect = $("sortSelect");
    const drawerMask = $("drawerMask");
    const drawerTitle = $("drawerTitle");
    const drawerSub = $("drawerSub");
    const drawerBody = $("drawerBody");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (s) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    function tokens() {
      return query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    }

    function filterAlias(name) {
      const map = {
        "房产": ["房产", "房贷", "按揭", "有房"],
        "低利率": ["低利率", "2.", "3.", "4.5", "利率"],
        "高额度": ["高额度", "100万", "150", "200", "300"],
        "线上": ["线上", "扫码", "电子账户"],
        "面签": ["面签", "网点"],
        "白名单": ["白名单", "加白"]
      };
      return map[name] || [name];
    }

    function scoreProduct(product, words) {
      let score = 0;
      const text = product.searchText || "";
      for (const word of words) {
        if (product.bank.toLowerCase().includes(word)) score += 16;
        if (product.displayName.toLowerCase().includes(word)) score += 14;
        if ((product.tags || []).join(" ").toLowerCase().includes(word)) score += 10;
        if (text.includes(word)) score += 4;
      }
      if (activeFilter !== "全部" && filterAlias(activeFilter).some(k => text.includes(k.toLowerCase()))) score += 8;
      return score;
    }

    function matches(product) {
      const text = product.searchText || "";
      const words = tokens();
      const keywordOk = words.every(word => text.includes(word));
      const filterOk = activeFilter === "全部" || filterAlias(activeFilter).some(k => text.includes(k.toLowerCase()));
      return keywordOk && filterOk;
    }

    function amountValue(product) {
      const nums = String(product.amount || "").match(/\d+(?:\.\d+)?/g);
      return nums ? Math.max(...nums.map(Number)) : 0;
    }

    function rateValue(product) {
      if (/月费率|月利率|月息|月综合/.test(product.rate || "")) return 999;
      const nums = String(product.rate || "").match(/\d+(?:\.\d+)?/g);
      return nums ? Math.min(...nums.map(Number)) : 999;
    }

    function getResults() {
      const words = tokens();
      const rows = products
        .filter(matches)
        .map(product => ({ product, score: scoreProduct(product, words) }));
      const sort = sortSelect.value;
      rows.sort((a, b) => {
        if (sort === "amount") return amountValue(b.product) - amountValue(a.product);
        if (sort === "rate") return rateValue(a.product) - rateValue(b.product);
        if (sort === "bank") return a.product.bank.localeCompare(b.product.bank, "zh-Hans-CN");
        return b.score - a.score || a.product.bank.localeCompare(b.product.bank, "zh-Hans-CN");
      });
      return rows;
    }

    function highlight(text) {
      let safe = escapeHtml(text || "");
      for (const word of tokens()) {
        if (!word) continue;
        const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        safe = safe.replace(new RegExp(escaped, "gi"), (m) => `<mark>${m}</mark>`);
      }
      return safe;
    }

    function firstMatch(product) {
      const words = tokens();
      const pool = [
        ...(product.admission || []),
        ...(product.credit || []),
        ...(product.materials || []),
        ...(product.notes || []),
        product.tags.join(" ")
      ];
      if (!words.length && activeFilter !== "全部") {
        return pool.find(line => filterAlias(activeFilter).some(k => line.includes(k))) || pool[0] || "";
      }
      return pool.find(line => words.some(word => line.toLowerCase().includes(word))) || pool[0] || "";
    }

    function renderFilters() {
      filtersNode.classList.toggle("expanded", filtersExpanded);
      const filterButtons = filters.map(item => `
        <button class="chip ${item === activeFilter ? "active" : ""}" type="button" data-filter="${escapeHtml(item)}">${escapeHtml(item)}</button>
      `).join("");
      const toggleText = filtersExpanded ? "收起" : "更多";
      filtersNode.innerHTML = filterButtons + `
        <button class="chip more-chip" id="toggleFilters" type="button">${toggleText}</button>
      `;
    }

    function renderStats(rows) {
      resultTotal.textContent = rows.length;
      bankTotal.textContent = new Set(rows.map(row => row.product.bank)).size;
      const counts = {};
      rows.forEach(({ product }) => { counts[product.type] = (counts[product.type] || 0) + 1; });
      topType.textContent = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || "-";
      $("dataCount").textContent = `${products.length} 条产品`;
      hintText.textContent = query ? "当前按关键词精确匹配，可空格输入多个条件" : "可输入多个关键词，空格分隔";
      clearBtn.style.display = query ? "block" : "none";
    }

    function renderList() {
      const rows = getResults();
      renderStats(rows);
      empty.style.display = rows.length ? "none" : "block";
      list.innerHTML = rows.map(({ product }) => {
        const match = firstMatch(product);
        return `
          <article class="card">
            <button type="button" data-id="${product.id}">
              <div class="card-head">
                <div>
                  <h2 class="bank">${highlight(product.bank)}</h2>
                  <p class="product">${highlight(product.displayName)}</p>
                </div>
                <span class="type">${escapeHtml(product.type || "产品")}</span>
              </div>
              <div class="metrics">
                <div class="metric"><span>额度</span><strong>${escapeHtml(product.amount)}</strong></div>
                <div class="metric"><span>利率</span><strong>${escapeHtml(product.rate)}</strong></div>
                <div class="metric"><span>期限</span><strong>${escapeHtml(product.term)}</strong></div>
              </div>
              <div class="match-line">${highlight(match || "点击查看准入、征信和材料要求")}</div>
              <div class="tags">${(product.tags || []).slice(0, 6).map(tag => `<span class="tag">${highlight(tag)}</span>`).join("")}</div>
            </button>
          </article>
        `;
      }).join("");
    }

    function listBlock(title, items, fallback = "未明确") {
      const clean = (items || []).filter(Boolean);
      return `
        <section class="block">
          <h3>${escapeHtml(title)}</h3>
          ${clean.length ? `<ul>${clean.map(item => `<li>${highlight(item)}</li>`).join("")}</ul>` : `<p>${escapeHtml(fallback)}</p>`}
        </section>
      `;
    }

    function openDetail(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;
      drawerTitle.textContent = product.bank;
      drawerSub.textContent = product.displayName;
      const flags = product.flags || {};
      drawerBody.innerHTML = `
        <div class="detail-metrics">
          <div class="metric"><span>额度</span><strong>${escapeHtml(product.amount)}</strong></div>
          <div class="metric"><span>利率</span><strong>${escapeHtml(product.rate)}</strong></div>
          <div class="metric"><span>期限</span><strong>${escapeHtml(product.term)}</strong></div>
        </div>
        <div class="tags">${(product.tags || []).map(tag => `<span class="tag">${highlight(tag)}</span>`).join("")}</div>
        <div class="flag-grid">
          <div class="flag"><b>展业区域</b>${escapeHtml(product.area || "未知")}</div>
          <div class="flag"><b>还款方式</b>${escapeHtml(product.repay || "未明确")}</div>
          <div class="flag"><b>白名单</b>${escapeHtml(flags.whiteList || "未知")}</div>
          <div class="flag"><b>面签</b>${escapeHtml(flags.interview || "未知")}</div>
          <div class="flag"><b>进件方式</b>${escapeHtml(flags.entryWay || "未明确")}</div>
          <div class="flag"><b>本行卡</b>${escapeHtml(flags.bankCard || "未知")}</div>
        </div>
        ${listBlock("准入要求", product.admission)}
        ${listBlock("征信要求", product.credit)}
        ${listBlock("所需材料", product.materials)}
        ${listBlock("办理流程", product.process)}
        ${listBlock("备注", product.notes)}
        <p class="source">来源：${escapeHtml(product.source || "Excel 导入")}。本页为内部查询工具，具体进件以银行最新政策为准。</p>
      `;
      drawerMask.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeDetail() {
      drawerMask.style.display = "none";
      document.body.style.overflow = "";
    }

    filtersNode.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      renderFilters();
      renderList();
    });
    filtersNode.addEventListener("click", (event) => {
      if (event.target.closest("#toggleFilters")) {
        filtersExpanded = !filtersExpanded;
        renderFilters();
      }
    });

    list.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-id]");
      if (button) openDetail(button.dataset.id);
    });

    searchInput.addEventListener("input", (event) => {
      query = event.target.value;
      renderList();
    });

    sortSelect.addEventListener("change", renderList);
    clearBtn.addEventListener("click", () => {
      query = "";
      searchInput.value = "";
      renderList();
      searchInput.focus();
    });
    $("resetBtn").addEventListener("click", () => {
      activeFilter = "全部";
      query = "";
      searchInput.value = "";
      sortSelect.value = "match";
      renderFilters();
      renderList();
    });
    $("focusBtn").addEventListener("click", () => searchInput.focus());
    $("closeDrawer").addEventListener("click", closeDetail);
    drawerMask.addEventListener("click", (event) => {
      if (event.target === drawerMask) closeDetail();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDetail();
    });

    renderFilters();
    renderList();
  </script>
</body>
</html>
